
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#07111c">
  <title>FUTOF | Football 3D</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loading">
    <div class="loading-logo">FUTOF</div>
    <div class="loading-text">Cargando estadio 3D...</div>
  </div>

  <div id="game">
    <div id="topbar">
      <div class="brand">FUTOF<span> 3D</span></div>
      <div id="scoreboard">
        <div class="team-name">BLUE</div>
        <div id="score">0 - 0</div>
        <div class="team-name">RED</div>
      </div>
      <div id="clock">00:00</div>
    </div>

    <div id="message">¡Comienza el partido!</div>

    <div id="controls">
      <div id="joystick-zone">
        <div id="joystick-base">
          <div id="joystick-stick"></div>
        </div>
      </div>

      <div id="action-buttons">
        <button id="sprint" class="action secondary">⚡<small>VELOCIDAD</small></button>
        <button id="pass" class="action pass">➤<small>PASE</small></button>
        <button id="shoot" class="action shoot">⚽<small>TIRO</small></button>
      </div>
    </div>

    <div id="bottom-info">
      <span>FUTOF 0.1</span>
      <span>PARTIDO AMISTOSO</span>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
